[project]
name = "interactive-chat-agent"
version = "0.1.0"
description = "US Census conversational agent built with LangGraph"
requires-python = ">=3.11"
dependencies = [
    # Existing Snowflake / app stack
    "snowflake-snowpark-python==1.49.0",
    "snowflake-core==1.12.0",
    "streamlit==1.56.0",
    "python-dotenv==1.2.2",
    # LangGraph agent
    "langchain==1.4.7",
    "langgraph==1.2.17",
    "langchain-snowflake==0.2.3",
    "pydantic==2.14.1",
    "sqlglot==30.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
